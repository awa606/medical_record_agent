services:
  app:
    build: .
    image: medical-record-agent:closed-loop
    environment:
      RECORD_PROVIDER_MODE: edge
      MRA_ANONYMIZE: "1"
      MEDICAL_RECORD_AGENT_BOOTSTRAP_ADMIN_PASSWORD: ${MRA_LOOP_ADMIN_PASSWORD:?Set a unique local test password}
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
      LLM_TIMEOUT_SECONDS: "120"
      LLM_MAX_RETRIES: "1"
      MEDICAL_RECORD_AGENT_DB: /app/runtime/record.sqlite3
      MEDICAL_RECORD_AGENT_UPLOAD_DIR: /app/runtime/uploads
      MEDICAL_RECORD_AGENT_OUTPUT_DIR: /app/runtime/outputs
      MEDICAL_RECORD_AGENT_SPEAKER_PROFILE_DIR: /app/runtime/speaker_profiles
      MEDICAL_RECORD_AGENT_ASR_ENGINE: funasr
      MEDICAL_RECORD_AGENT_REQUIRE_FUNASR: "1"
      ASR_PREWARM_ENABLED: "1"
      FUNASR_DEVICE: cpu
      FUNASR_STREAMING_MODEL_ID: paraformer-zh-streaming
      SPEAKER_ROLE_PROVIDER: rules
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MODELSCOPE_CACHE: /app/model_cache/modelscope
      MODELSCOPE_HOME: /app/model_cache/modelscope
      HF_HOME: /app/model_cache/hf
      TORCH_HOME: /app/model_cache/torch
    volumes:
      - ${MRA_LOOP_RUNTIME:?Set a new private runtime directory}:/app/runtime
      - ${MRA_ASR_CACHE:?Set the existing ASR cache directory}:/app/model_cache
    networks: [local_only]
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: "no"
  ollama:
    image: ollama/ollama:0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${MRA_OLLAMA_MODELS:?Set the existing Ollama models directory}:/root/.ollama/models:ro
    gpus: all
    networks: [local_only]
    restart: "no"
  gateway:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports:
      - "127.0.0.1:${MRA_LOOP_PORT:-2780}:8080"
    volumes:
      - ./config/local-loop-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [browser_ingress, local_only]
    depends_on: [app]
    restart: "no"
networks:
  browser_ingress: {}
  local_only:
    internal: true
