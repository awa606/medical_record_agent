server {
    listen 8080;
    server_name _;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 200m;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
