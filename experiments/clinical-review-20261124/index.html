<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>MediListen · 门诊听录评审</title>
<style>*{box-sizing:border-box}body{margin:0;color:#173342;background:#f3f6f5;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:840px;margin:auto;padding:clamp(22px,5vw,64px) clamp(18px,4vw,40px)}header{border-bottom:2px solid #00685e;padding-bottom:18px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.2;margin:4px 0 9px}header p{margin:0;color:#385661}nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
nav a{min-height:54px;color:#00584e;background:#fff;border:1px solid #b9ccca;border-radius:8px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none}
nav a:hover{border-color:#00685e}nav a:focus-visible{outline:3px solid #155daf;outline-offset:3px}nav span{color:#3f5960;font-size:14px}
footer{margin-top:22px;color:#3f5960}@media(max-width:600px){nav{grid-template-columns:1fr}}@media print{nav{grid-template-columns:1fr}}</style></head>
<body><main><header><p>MediListen</p><h1>门诊听录评审</h1><p>六场中文合成问诊。每份病例独立保存答卷。</p></header>
<p>请先按组织者分配的病例听原音，用评审代号记录你听到的事实。锁定并下载首次答卷。对于有待评草稿的病例，在同一份病例中选回首次答卷，继续核对草稿。</p>
<nav aria-label="选择病例">{{CASES}}</nav><footer>全部操作在本机完成。请保留每次下载的答卷，按组织者约定的方式提交。</footer></main></body></html>
