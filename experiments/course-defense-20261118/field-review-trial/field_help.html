<section>
  <h2>先试一次字段审核</h2>
  <p>在主诉选择<strong>查看问诊原文</strong>，核对本次就诊引用，按 Esc 返回。没有保存引文的字段显示<strong>查看字段记录</strong>。手工修改后如有上一版引文，可打开<strong>查看上版引文</strong>作只读对照。字段标记为冲突且存有引文时，打开<strong>核对冲突引文</strong>检查说话人和上下文。</p>
  <p>找到“过敏史”，选择<strong>查知识资料</strong>。查看资料名称、版本、登记用途及条文片段，再按 Esc 返回。试用包附一份《门（急）诊诊疗信息页质量管理规定（试行）》的项目释义，共六条。检索结果用于核对文书栏目；本病例的过敏史须另查本次就诊记录。</p>
</section>
