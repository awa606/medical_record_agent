<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediListen · 同条件对照</title><style>*{box-sizing:border-box}body{font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif;color:#253746;background:#edf1f4;margin:0}header{padding:24px 32px;background:#fff;border-bottom:1px solid #ccd6df}h1{font-size:25px;margin:0 0 8px}p{margin:4px 0;color:#5b7181}a{color:#245b82}main{padding:24px;max-width:1700px;margin:auto}.tools{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}button,a.button{font:inherit;cursor:pointer;background:#fff;border:1px solid #bac9d4;border-radius:6px;padding:7px 14px;text-decoration:none;color:#254d69}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stack .pair{grid-template-columns:1fr}figure{margin:0;background:white;border:1px solid #cbd5df;border-radius:8px;overflow:hidden}figcaption{padding:12px 16px;border-bottom:1px solid #dce4ea}figure img{display:block;width:100%;height:auto}.missing{padding:48px 24px;color:#657b8b;background:#f8fafb}.explain{margin-top:24px;padding:20px 24px;background:white;border:1px solid #cbd5df;border-radius:8px}.explain li{margin:8px 0}@media(max-width:800px){.pair{grid-template-columns:1fr}header{padding:20px}main{padding:16px}}</style><header><h1>同一病例，同一状态，再比较界面。</h1><p>比较条件：合成患者甲 · 六句对话 · 已确认角色 · 暂停且未编辑 · 1366×768 CSS px · 浏览器100%。</p><p>只有符合条件的本轮实际截图才放入下方。图片未就绪时明确显示待验证。</p></header><main><div class="tools"><button id="toggle">上下大图</button><a class="button" href="./index.html">试用新版</a><a class="button" href="./references.html">查看参考映射</a></div><div class="pair"><figure><figcaption><b>旧版</b> · 三面板工作台</figcaption><img src="./evidence/01-old-capture-1366.png" alt="本轮同条件旧版实际截图"></figure><figure><figcaption><b>新版</b> · 文档接诊工作台</figcaption><img src="./evidence/02-new-capture-1366.png" alt="本轮同条件新版实际截图"></figure></div><section class="explain"><b>比较重点</b><ul><li>病历标题、正文、字段工具是否形成明确主次。</li><li>同样六句原文是否更容易完整阅读，角色与内容是否清楚。</li><li>辅助区域是否可辨认，是否挤占原文。</li><li>窄屏与真实缩放下，患者、保存状态和当前主动作是否可达。</li></ul><p>更清楚的模块关系不等于用户认为更美。最终视觉判断与医生试用单独记录。</p></section></main><script>document.querySelector('#toggle').onclick=function(){document.body.classList.toggle('stack');this.textContent=document.body.classList.contains('stack')?'左右并排':'上下大图'};document.querySelectorAll('img').forEach(x=>x.onerror=()=>{const p=document.createElement('div');p.className='missing';p.textContent='本轮截图待验证；未使用旧截图冒充。';x.replaceWith(p)});</script></html>
