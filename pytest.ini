[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git .artifacts data demo docs MediListen-Engineering-Archive
addopts = --import-mode=importlib --basetemp=.artifacts/test-tmp -p no:cacheprovider
markers =
    integration: requires an assembled application boundary
    model: requires optional local model dependencies or weights
    browser: requires Playwright and a browser runtime
    hardware: requires explicitly identified target hardware
